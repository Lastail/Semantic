project:
  data_dir: data
  model_dir: models
  output_dir: outputs
  cache_dir: outputs/cache
device:
  device: cuda:5
  dtype: float16
generation:
  max_tokens: 4096
  min_tokens: 4000
  samples_per_temperature: 1000
  max_workers: 70
  thinking_enabled: false
  temperatures:
    start: 0.0
    stop: 3.0
    step: 0.2
representation:
  type: positional
  layer: -1
  pooling: mean
  batch_size: 4
fss:
  sizes: [100, 200, 300, 400, 500]
  size_type: token
  mu_cutoff: 0.1
  temperature_range: [0.3, 1.8]
  guess_Tc: 1.2
  guess_nu: 1.0
  guess_xi: 0.0
